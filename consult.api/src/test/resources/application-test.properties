spring.datasource.url=jdbc:h2:mem:ats_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.cookie.secure=false
app.security.cookie.same-site=Lax
app.security.csrf.enabled=true
app.cors.allowed-origins=http://localhost:4200
app.security.rate-limit.max-attempts=10
app.security.rate-limit.window-seconds=60
app.seed-admin.email=
app.seed-admin.password=

app.uploads.storage=local
app.uploads.resumes-dir=target/test-resumes
app.uploads.resume-max-size-bytes=10485760
