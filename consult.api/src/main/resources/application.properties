spring.application.name=consult.api

# Em producao defina SPRING_PROFILES_ACTIVE=prod. Em desenvolvimento use SPRING_PROFILES_ACTIVE=dev.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Conexao local (o perfil prod exige DB_URL, DB_USERNAME e DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ats_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Upload de curriculos
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:12MB}
app.uploads.storage=${RESUME_STORAGE:local}
app.uploads.resumes-dir=${RESUME_UPLOAD_DIR:uploads/resumes}
app.uploads.resume-max-size-bytes=${RESUME_MAX_SIZE_BYTES:10485760}

# Storage S3-compatible (Cloudflare R2, MinIO ou AWS S3)
# R2: region=auto, endpoint=https://<account-id>.r2.cloudflarestorage.com, force-path-style=false
# MinIO: endpoint=http://localhost:9000, force-path-style=true
app.uploads.s3.bucket=${RESUME_S3_BUCKET:}
app.uploads.s3.region=${RESUME_S3_REGION:auto}
app.uploads.s3.endpoint=${RESUME_S3_ENDPOINT:}
app.uploads.s3.access-key=${RESUME_S3_ACCESS_KEY:}
app.uploads.s3.secret-key=${RESUME_S3_SECRET_KEY:}
app.uploads.s3.path-prefix=${RESUME_S3_PATH_PREFIX:resumes}
app.uploads.s3.force-path-style=${RESUME_S3_FORCE_PATH_STYLE:false}

# Paginacao
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# Sessao opaca no servidor (o navegador guarda apenas o ID de sessao)
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:ats_session}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Strict}
server.servlet.session.cookie.path=/

# Cookie CSRF e atributos partilhados com a sessao
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# CSRF (habilitado por padrao; o perfil dev desabilita para o Angular em localhost:4200)
app.security.csrf.enabled=${CSRF_ENABLED:true}

# Auto-registo publico (desativado no perfil prod; habilite apenas se necessario)
app.security.registration.enabled=${REGISTRATION_ENABLED:true}

# Rate limiting de login/registo
app.security.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:10}
app.security.rate-limit.ip-max-attempts=${RATE_LIMIT_IP_MAX_ATTEMPTS:50}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.security.rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:50000}

# Origens permitidas para CORS (lista separada por virgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Administrador inicial (desativado quando email/senha nao sao informados)
app.seed-admin.email=${APP_ADMIN_EMAIL:}
app.seed-admin.password=${APP_ADMIN_PASSWORD:}

# Observabilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
info.app.name=${spring.application.name}
info.app.description=API de gestao de vagas (ATS)
