# Em producao estas variaveis sao obrigatorias.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# Cookie seguro: exige HTTPS (Render/Caddy ja fornecem TLS)
app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=${COOKIE_SAME_SITE:Strict}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# Vazio quando o Angular e servido pela propria API (same-origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.security.csrf.enabled=${CSRF_ENABLED:true}
app.security.registration.enabled=${REGISTRATION_ENABLED:false}

app.seed-admin.email=${APP_ADMIN_EMAIL:}
app.seed-admin.password=${APP_ADMIN_PASSWORD:}
